name: Build and deploy game deals

# Runs the digest daily in the cloud (no need for your PC to be on) and publishes
# the result to GitHub Pages. Also runs on every push and can be triggered manually.
on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours (00:00, 08:00, 16:00 UTC)
  workflow_dispatch: {}     # adds a "Run workflow" button in the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's digest
        run: python run_daily.py

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
